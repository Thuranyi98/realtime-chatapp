services:
  db:
    image: mysql:8.4
    container_name: chat_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: realtime_chat
    ports:
      - "3307:3306"  # Host 3307 to avoid conflict with local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:root@db:3306/realtime_chat
      JWT_SECRET: replace_me
      JWT_EXPIRES_IN: 1d
      PORT: 4000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: local
        NEXT_PUBLIC_API_URL_LOCAL: http://localhost:4000
        NEXT_PUBLIC_SOCKET_URL_LOCAL: http://localhost:4000
    container_name: chat_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_API_URL_LOCAL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL_LOCAL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  mysql_data:
